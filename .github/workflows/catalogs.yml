# Catalogs → catalog-pt-public (mirror of this hub's data/catalogs/).
# On a push that changes data/catalogs/ it rebuilds only the changed catalogs (+ the index); a change to
# catalog-build/ rebuilds all of them. It always uploads the built pages as an artifact for review, and
# publishes to prod-at22/catalog-pt-public only when BOTH are set in this repo's settings:
#   secret   CATALOG_PUBLIC_TOKEN  fine-grained token, catalog-pt-public only, Contents: read and write
#   variable CATALOG_AUTOPUBLISH   true
name: Catalogs → catalog-pt-public
on:
  push:
    branches: [main]
    paths: ["data/catalogs/**", "catalog-build/**", ".github/workflows/catalogs.yml"]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Catalogs to build, space-separated (empty = all)"
        type: string
        default: ""
concurrency: { group: catalogs, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAN_PUBLISH: ${{ secrets.CATALOG_PUBLIC_TOKEN != '' && vars.CATALOG_AUTOPUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r catalog-build/requirements.txt
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          repository: prod-at22/catalog-pt-public
          path: catalog-build/site
          token: ${{ secrets.CATALOG_PUBLIC_TOKEN || github.token }}
      - name: Which catalogs to build
        id: pick
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slugs=${{ inputs.slugs }}" >> "$GITHUB_OUTPUT"; echo "building: ${{ inputs.slugs || 'ALL' }}"; exit 0
          fi
          if [ -z "$before" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null \
             || git diff --name-only "$before" HEAD | grep -qE '^(catalog-build/|\.github/workflows/catalogs\.yml)'; then
            echo "slugs=" >> "$GITHUB_OUTPUT"; echo "building ALL catalogs"
          else
            slugs=$(git diff --name-only "$before" HEAD -- data/catalogs | grep -v index.json | sed -n 's|^data/catalogs/\(.*\)\.json$|\1|p' | tr '\n' ' ')
            echo "slugs=$slugs" >> "$GITHUB_OUTPUT"; echo "building: $slugs"
          fi
      - name: Build
        run: python -u catalog-build/build.py ${{ steps.pick.outputs.slugs }}
        timeout-minutes: 40
      - uses: actions/upload-artifact@v4
        with: { name: catalog-site, path: "catalog-build/site/*.*", retention-days: 7 }
      - name: Publish to catalog-pt-public
        if: env.CAN_PUBLISH == 'true'
        working-directory: catalog-build/site
        run: |
          git config user.name "PT R&D Costing Hub"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Mirror from PT R&D Costing Hub ${GITHUB_SHA::7}: ${{ steps.pick.outputs.slugs || 'all catalogs' }}"
          git push
      - name: Not published
        if: env.CAN_PUBLISH != 'true'
        run: echo "::notice::Built only (artifact catalog-site). Set secret CATALOG_PUBLIC_TOKEN and variable CATALOG_AUTOPUBLISH=true to publish."
