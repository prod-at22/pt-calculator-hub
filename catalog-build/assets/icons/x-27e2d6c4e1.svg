  <div class="day-title"><span class="day-num">Day 3</span>Jeju West & South Tour</div>
  <ul class="activities">
  <li>Cheonjeyeon Waterfalls (famous three-tiered waterfall)</li>
  <li>Yongmeori Coast Beach (hydrovolcano rocky shore formed by volcanic debris)</li>
  <li>Osulloc Green Tea Farm and Innisfree Jeju House (tea farm owned by premium Korean tea brand + Innisfree signature store)</li>
  <li>Nuwemaru Street (shopping — branded + local brands)</li>
  </ul>
  </td>
  <td>Private Transport</td>
  <td>Breakfast, Lunch, Dinner</td>
  <td>4-Star Hotel (Jeju City)</td>
  </tr>
  <tr>
