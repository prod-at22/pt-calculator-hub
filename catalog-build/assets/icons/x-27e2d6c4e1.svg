  <div class="day-title"><span class="day-num">Day 4</span>Jeju East Tour</div>
  <ul class="activities">
  <li>Songeup Folk Village (Korean traditional village)</li>
  <li>Seopjikoji (famous lighthouse at a cliff)</li>
  <li>Seongsan Ilchulbong (sunrise peak, a crater, a UNESCO World Heritage Site)</li>
  <li>Haenyeo Show</li>
  <li>Gimnyeong Beach (famous for its cobalt-blue seawater)</li>
  <li>Seasonal tour (entrance fee included) — Autumn: Sangumburi Park (silver grass, pink muhly); Winter: Tangerine Farm (tangerine fruit picking, add-on); Spring: Canola Field / Cherry Blossom; Summer: Sunflower Park / Hydrangea Flowers</li>
  </ul>
