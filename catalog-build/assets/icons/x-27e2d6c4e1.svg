  <ul class="activities">
  <li>Arrive Jeju - Airport Pickup</li>
  <li>Mysterious Road (the optical illusion of a downward-sloping hill that looks like an incline road/hill)</li>
  <li>Yongduam Rock (oceanfront volcanic rock formation in the shape of a dragon's head)</li>
  <li>Yongyeon Pond (where water from Hallasan Mountain meets the sea, reflecting its stunning vistas & clear water)</li>
  <li>Iho Tewoo Horse Lighthouse (lighthouse built in the shape of Jeju's pony)</li>
  <li>Check-in</li>
  </ul>
  </td>
