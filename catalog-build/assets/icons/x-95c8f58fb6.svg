  <ul class="activities">
  <li>Early breakfast</li>
  <li>Depart for the Kolsay region (5 hours)</li>
  <li>Black Canyon (a spectacular canyon viewpoint, subject to time availability)</li>
  <li>Kolsay Lake (a crystal-clear alpine lake surrounded by pine forests and mountains)</li>
  <li>Charyn Canyon, the 'Grand Canyon of Central Asia' (dramatic rock formations) — 2 hours</li>
  <li>Return to Almaty (3 hours)</li>
  <li>Dinner at a restaurant or takeaway, depending on return timing</li>
  <li>Return to hotel</li>
  </ul>
