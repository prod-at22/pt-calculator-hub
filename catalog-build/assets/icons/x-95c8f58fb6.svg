  <ul class="activities">
  <li>Medeu Ice Rink (the highest mountain ice rink in the world, and gateway to Shymbulak)</li>
  <li>Shymbulak Ski Resort (the largest ski resort in Central Asia, surrounded by the Tian Shan mountains) — 2-way cable car included</li>
  <li>Zenkov Cathedral (the second-tallest wooden church in the world, built entirely without nails)</li>
  <li>Park of 28 Panfilov Guardsmen (a World War II memorial park with lush greenery)</li>
  <li>Central Almaty Mosque (the largest mosque in Almaty, with striking Islamic architecture)</li>
  <li>Dinner at a local café</li>
  <li>Return to hotel</li>
  </ul>
  </td>
