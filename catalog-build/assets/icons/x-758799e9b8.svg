  <li>Shirakawago (famous for traditional Gassho-style thatched houses)
  <ul class="sub-activities"><li>Shiroyama Observatory Deck (panoramic views over Shirakawa-go village & mountains)</li></ul>
  </li>
  <li>Gifu Mosque (white mosque with modern Ottoman-style architecture)</li>
  <li>Transfer to Osaka</li>
  <li>Check-in</li>
