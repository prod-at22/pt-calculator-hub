  <ul class="sub-activities"><li>Takayama Old Town (preserved Edo-period streets lined with wooden houses)</li><li>Takayama Retro Museum (nostalgic museum featuring vintage toys and culture)</li></ul>
  </li>
  <li>Check-in</li>
  </ul>
