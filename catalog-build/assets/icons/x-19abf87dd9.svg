  <ul class="activities">
  <li>Rengganis Bridge & Keranjang Sultan, chairlift included — VVIP ticket on weekends (longest suspended bridge in Southeast Asia)</li>
  <li>Kawah Putih (famous volcanic crater in Bandung)</li>
  <li>Jalan Asia Afrika (pass by the street full of ghost-cosplayers)</li>
  <li>Braga Street (colonial architecture lined with trendy shops & restaurants)</li>
  </ul>
  </td>
  <td>Private Transport</td>
  <td>Breakfast, Lunch, Dinner</td>
