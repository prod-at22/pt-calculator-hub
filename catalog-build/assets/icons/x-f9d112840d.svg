  <ul class="sub-activities"><li>400m Reindeer Ride (included)</li><li>Reindeer Farm (optional, see Additional Activities)</li><li>Husky Farm (optional, see Additional Activities)</li><li>Husky Rides (optional, see Additional Activities)</li></ul>
